<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaveMines </title>
    <link rel="stylesheet" href="../static/css/games/davemine.css">
</head>
<body>
    <div class="container">
        <div class="controls-panel">
            <div class="input-group">
                <div class="input-label">
                    <span>Montant du Pari</span>
                    <span id="betUSD">0,00 $DAVE</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" class="input-field" id="betAmount" value="0" step="0.00000001" min="0">
                    <div class="input-icon"><img src="../static/css/sections/assets/davecoin2.png" alt="Davecoin" class="icon-img"></div>
                </div>
                <div class="bet-buttons">
                    <button class="bet-btn" onclick="halfBet()">½</button>
                    <button class="bet-btn" onclick="doubleBet()">2×</button>
                </div>
            </div>

            <div class="input-group">
                <div class="input-label">
                    <span>Mines</span>
                </div>
                <select class="dropdown" id="minesCount">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                </select>
            </div>

            <button class="play-btn" id="playBtn" onclick="startGame()">Pari</button>

            <div class="random-selection" onclick="selectRandom()">Sélection aléatoire</div>

            <div class="profit-display">
                <div class="input-label">
                    <span>Profit total (<span id="multiplier">1,00</span>×)</span>
                    <span id="profitUSD">0,00 $DAVE</span>
                </div>
                <div class="profit-value">
                    <span id="profitAmount">0.00000000</span>
                    <div class="input-icon"><img src="../static/css/sections/assets/davecoin2.png" alt="Davecoin" class="icon-img"></div>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="grid" id="gameGrid"></div>
        </div>
    </div>

    <div class="watermark">Dave's Palace</div>

    <script src="../static/js/common/davecoin.js"></script>
    <script src="../static/js/games/davemine.js"></script>
</body>
</html>
